# Smart Battery Tracking System Configuration
# Centralized configuration for all components

# Data Configuration
data:
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  final_dataset: "data/processed/final_dataset.csv"
  nasa_battery_file: "data/processed/nasa_battery_with_rul.csv"

# Model Configuration
model:
  model_dir: "models"
  model_file: "models/model.pkl"
  metadata_file: "models/metadata.pkl"
  shap_explainer_file: "models/shap_explainer.pkl"

  # XGBoost Parameters
  xgboost:
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42

  # Training Parameters
  training:
    test_size: 0.2
    random_state: 42
    rul_clip_max: 1500
    downsample_size: 200000
    balance_bins: 5
    balance_max_per_bin: 40000

# Features Configuration
features:
  selected_features:
    - "Voltage_measured"
    - "Current_measured"
    - "Temperature_measured"
    - "Current_load"
    - "Voltage_load"
  target: "rul"

# API Configuration
api:
  host: "0.0.0.0"
  port: 5000
  debug: true

rag:
  dataset_file: "data/battery_docs.json"
  store_dir: "embeddings/store"
  top_k: 3

# Logging Configuration
logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
